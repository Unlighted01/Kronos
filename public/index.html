<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Kronos</title>
        <link rel="stylesheet" href="./css/style.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        />
    </head>
    <body>
        <div class="dashboard-container">
            <div class="panel timer-panel">
                <h2>Pomodoro</h2>
                <div class="timer-container">
                    <svg class="timer-progress" viewbox="0 0 160 160">
                        <circle class="bg" cx="80" cy="80" r="70" />
                        <circle
                            class="progress"
                            id="timer-ring"
                            cx="80"
                            cy="80"
                            r="70"
                        />
                    </svg>
                    <div class="timer-display" id="timer-display">25:00</div>
                </div>
                <div class="timer-modes">
                    <button class="mode-btn active" data-mode="focus">
                        Focus
                    </button>
                    <button class="mode-btn" data-mode="short-break">
                        Short Break
                    </button>
                    <button class="mode-btn" data-mode="long-break">
                        Long Break
                    </button>
                </div>
                <div class="timer-controls">
                    <button id="timer-start" class="btn-control">
                        <i class="fa-solid fa-play"></i> Start
                    </button>
                    <button id="timer-reset" class="btn-control">
                        <i class="fa-solid fa-rotate"></i> Reset
                    </button>
                </div>
            </div>

            <div class="panel calendar-panel">
                <div class="calendar">
                    <div class="header">
                        <div id="prev" class="btn">
                            <i class="fa-solid fa-arrow-left-long"></i>
                        </div>
                        <h1 id="month-year"></h1>
                        <div id="next-btn" class="btn">
                            <i class="fa-solid fa-arrow-right-long"></i>
                        </div>
                    </div>
                    <div class="weekdays">
                        <div>Sun</div>
                        <div>Mon</div>
                        <div>Tue</div>
                        <div>Wed</div>
                        <div>Thu</div>
                        <div>Fri</div>
                        <div>Sat</div>
                    </div>
                    <div class="days" id="days"></div>
                </div>
            </div>

            <div class="panel dtr-panel">
                <h2 class="dtr-title">DTR Log</h2>
                <p id="dtr-date-display">Select a Date..</p>
                <div class="dtr-total-summary">
                    <span>Total focus logged: </span>
                    <strong class="dtr-total-time">0 hrs 0 minutes </strong>
                </div>

                <form id="dtr-form" class="dtr-form">
                    <input
                        type="text"
                        id="dtr-task-name"
                        placeholder="What did you work on?"
                        required
                    />
                    <div class="dtr-form-row">
                        <div class="time-input-group">
                            <input
                                type="number"
                                id="dtr-hours"
                                min="0"
                                max="23"
                                value="0"
                            />
                            <label for="dtr-hours">hrs</label>
                        </div>
                        <div class="time-input-group">
                            <input
                                type="number"
                                id="dtr-mins"
                                min="0"
                                max="59"
                                value="25"
                            />
                            <label for="dtr-mins">mins</label>
                        </div>
                        <button type="submit" class="btn-add-task">
                            <i class="fa-solid fa-plus"></i> Add
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <script src="./js/calendar.js"></script>
    </body>
</html>
